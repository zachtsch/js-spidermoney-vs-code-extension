name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, such as v0.1.44
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  marketplace:
    name: marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify release tag
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $expected_tag."
            exit 1
          fi
          if [[ -z "$(git tag --points-at HEAD --list "$RELEASE_TAG")" ]]; then
            echo "::error::$RELEASE_TAG does not point to the checked-out commit."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$RELEASE_TAG must point to a commit on main."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Compile tests
        run: npm run compile-tests

      - name: Run extension tests
        run: xvfb-run -a npm exec -- vscode-test

      - name: Package VSIX
        run: npm run package:vsix -- --out extension.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ env.RELEASE_TAG }}
          path: extension.vsix
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        run: npm exec -- vsce publish --packagePath extension.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
